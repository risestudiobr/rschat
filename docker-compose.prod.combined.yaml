services:
  base: &base
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    volumes:
      - storage_data:/app/storage

  web:
    <<: *base
    environment:
      - ROLE=web
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    <<: *base
    environment:
      - ROLE=worker
      - QUEUES=default
      - SIDEKIQ_CONCURRENCY=10
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rspostgres*123!

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
